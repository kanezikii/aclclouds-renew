name: Auto-Renew-ACL

on:
  workflow_dispatch:

  schedule:
    # 每隔 3 天 UTC 02:00（北京时间 10:00）
    - cron: '0 2 */3 * *'

jobs:
  Renew-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      actions: write

    steps:
      # 下载仓库
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      # Python
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 安装系统依赖
      - name: 🛠️ Install System Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            xvfb \
            x11-utils \
            xdotool \
            scrot \
            fonts-noto-cjk

      # 安装Python依赖
      - name: 🐍 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            seleniumbase \
            aiohttp \
            requests pynacl

          seleniumbase install chromedriver

      # 启动 sing-box（可选）
      - name: 🌐 Setup Sing-box Proxy
        if: ${{ secrets.NODE_LINK != '' }}
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      # 运行续期脚本
      - name: 🚀 Run Renew Script
        env:
          # Cookie 登录（优先）
          ACL_COOKIE: ${{ secrets.ACL_COOKIE }}

          # 账号密码（Cookie失效备用）
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}

          # Telegram
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          # 是否启用代理（true/false）
          IS_PROXY: ${{ secrets.IS_PROXY }}

          # SOCKS5地址（例如 socks5://127.0.0.1:1080）
          S5_PROXY: ${{ secrets.S5_PROXY }}

        run: |
          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1366x768x24" \
            python3 renew.py

      # 清理历史 Workflow（仅保留最近一次）
      - name: 🧹 Cleanup Old Workflow Runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list \
            --workflow="${{ github.workflow }}" \
            --limit=100 \
            --json databaseId \
            --jq '.[].databaseId')

          count=0

          for run_id in $runs
          do
            count=$((count + 1))

            if [ "$count" -gt 1 ]; then
              echo "Delete Run: $run_id"
              gh run delete "$run_id" || true
            fi
          done
